[project]
name = "diabetes-screening"
version = "1.0.0"
description = "Diabetes screening API trained on the WHO STEPS Kenya 2015 survey"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.165.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "joblib==1.6.0",
    "numpy==2.1.0",
    "pandas==2.2.3",
    "scipy==1.18.1",
    "scikit-learn==1.6.1",
    "lightgbm==4.5.0",
]

[tool.uv]
package = false          # an application, not a library: install the dependencies only, do not build a wheel

[tool.fastapi]
entrypoint = "deploy.app.main:app"
